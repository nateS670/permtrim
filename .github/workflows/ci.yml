name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & types (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: pip install -e ".[graph,azure,dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Ruff (format check)
        run: ruff format --check src tests scripts

      - name: Mypy (static types)
        run: mypy

  tables:
    name: Generated tables up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild engine tables from the doc TSV (--check, no write)
        run: python scripts/build_engine_tables.py --check

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package with all extras
        run: pip install -e ".[graph,azure,dev]"

      - name: Pytest (unit, coverage)
        run: pytest --cov=permtrim --cov-report=term-missing

      - name: CLI smoke (offline demo end-to-end)
        run: permtrim demo

  neo4j-integration:
    name: Neo4j integration (real UNWIND ingest)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/permtrim
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p permtrim 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with graph extra
        run: pip install -e ".[graph,dev]"

      - name: Pytest (integration, live Neo4j)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: permtrim
        run: pytest tests/test_neo4j_integration.py -v --no-header
