[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "permtrim"
version = "1.0.0"
description = "LLM-powered multi-cloud IAM least-privilege detector with guardrail-verified Terraform generation for AWS and Azure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "nateS670" }]
keywords = [
    "aws", "iam", "least-privilege", "cloudtrail", "cloud-security",
    "static-analysis", "terraform", "llm", "ollama", "multi-cloud",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.0",
]
azure = [
    "azure-mgmt-authorization>=4.0",
    "azure-mgmt-monitor>=7.0",
    "azure-identity>=1.15",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.6",
    # test_graph.py's render test asserts the PNG is not blank, and the
    # render path itself needs matplotlib — both optional at runtime
    # (CLI degrades gracefully), but pinned here so CI always covers them.
    "matplotlib>=3.8",
    "Pillow>=10",
]

[project.scripts]
permtrim = "permtrim.cli:main"

[project.urls]
Homepage = "https://github.com/nateS670/permtrim"
Issues = "https://github.com/nateS670/permtrim/issues"
Changelog = "https://github.com/nateS670/permtrim/releases"
Repository = "https://github.com/nateS670/permtrim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"permtrim" = ["data/*.json"]
"permtrim.analyzer" = ["data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests requiring a live service (Neo4j, ...); skipped without the matching env",
]
filterwarnings = [
    "error",
    # matplotlib's import chain pulls pyparsing, whose own deprecation
    # warnings are not ours to fix
    "ignore::DeprecationWarning:pyparsing",
    "ignore:.*deprecated - use.*:DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["permtrim"]
warn_unused_ignores = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Optional runtime extras: the lint job pins them via pip extras, but mypy
# must also pass in environments where only the core package is installed.
module = ["boto3", "botocore.*", "matplotlib", "matplotlib.*", "neo4j", "neo4j.*", "azure.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["SIM108"]  # keep explicit if/else in collection logic
